<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Vehicle - DriveEasy Rentals</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-car-side" style="color: var(--accent-teal); font-size: 1.75rem;"></i>
            <h1>DriveEasy</h1>
        </div>
        <ul class="sidebar-menu">
            <li class="sidebar-menu-item">
                <a th:href="@{/}"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            </li>
            <li class="sidebar-menu-item active">
                <a th:href="@{/admin/cars}"><i class="fa-solid fa-car"></i> Cars Directory</a>
            </li>
            <li class="sidebar-menu-item">
                <a th:href="@{/staff/customers}"><i class="fa-solid fa-users"></i> Customers</a>
            </li>
            <li class="sidebar-menu-item">
                <a th:href="@{/staff/reservations}"><i class="fa-solid fa-calendar-check"></i> Reservations</a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <p>&copy; 2026 DriveEasy Rentals</p>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-wrapper">
        <div class="header-container" style="margin-bottom: 2rem;">
            <div class="header-title">
                <h2>Add New Vehicle</h2>
                <p>Register a new car with pricing configurations to make it ready for bookings.</p>
            </div>
            <div class="header-actions">
                <a th:href="@{/admin/cars}" class="btn btn-secondary">
                    <i class="fa-solid fa-arrow-left"></i> Back to Fleet
                </a>
            </div>
        </div>

        <!-- Form Card -->
        <div class="form-card">
            <form th:action="@{/admin/cars/add}" method="POST">
                <!-- Car Model -->
                <div class="form-group">
                    <label for="model">Car Model Name</label>
                    <input type="text" id="model" name="model" class="form-control" placeholder="e.g. Honda Civic, Mahindra Thar" required>
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-control" required>
                        <option value="" disabled selected>Select Car Category</option>
                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.displayName}">Sedan</option>
                    </select>
                </div>

                <!-- Base Fare -->
                <div class="form-group">
                    <label for="baseFare">Base Fare (₹)</label>
                    <input type="number" step="0.01" min="0" id="baseFare" name="baseFare" class="form-control" placeholder="e.g. 500.00" required>
                </div>

                <!-- Rates Row -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="perKmRate">Per Km Rate (₹/km)</label>
                        <input type="number" step="0.01" min="0" id="perKmRate" name="perKmRate" class="form-control" placeholder="e.g. 12.00" required>
                    </div>
                    <div class="form-group">
                        <label for="perHourRate">Per Hour Rate (₹/hr)</label>
                        <input type="number" step="0.01" min="0" id="perHourRate" name="perHourRate" class="form-control" placeholder="e.g. 80.00" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="reset" class="btn btn-secondary">Reset</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Register Vehicle
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
