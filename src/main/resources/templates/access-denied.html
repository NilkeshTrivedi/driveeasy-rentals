<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Access Denied - DriveEasy</title>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="sidebar">
    <div class="sidebar-brand">
        <div class="sidebar-brand-icon">
            <i class="fa-solid fa-car-side"></i>
        </div>
        <div class="sidebar-brand-text">
            <h1>DriveEasy</h1>
            <span>Rental Management</span>
        </div>
    </div>
    <nav class="sidebar-nav">
        <ul class="sidebar-menu">
            <li class="sidebar-menu-item">
                <a th:href="@{/}">
                    <i class="fa-solid fa-chart-pie"></i> Dashboard
                </a>
            </li>
        </ul>
    </nav>
</div>

<div class="main-wrapper">
    <div style="display:flex;flex-direction:column;align-items:center;
                    justify-content:center;min-height:60vh;text-align:center;">

        <div style="width:80px;height:80px;background:var(--danger-bg);
                        border-radius:50%;display:flex;align-items:center;
                        justify-content:center;margin-bottom:20px;">
            <i class="fa-solid fa-shield-halved"
               style="font-size:2.5rem;color:var(--danger);"></i>
        </div>

        <h2 style="font-size:24px;font-weight:700;
                       color:var(--text-primary);margin-bottom:8px;">
            Access Denied
        </h2>

        <p style="color:var(--text-muted);max-width:400px;
                      margin-bottom:28px;font-size:14px;line-height:1.6;">
            You don't have permission to access this page.
            Please contact your administrator if you think this is a mistake.
        </p>

        <div style="display:flex;gap:10px;">
            <a th:href="@{/}" class="btn btn-primary">
                <i class="fa-solid fa-house"></i> Go to Dashboard
            </a>
            <a th:href="@{/logout}" class="btn btn-secondary">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        </div>
    </div>
</div>
</body>
</html>
