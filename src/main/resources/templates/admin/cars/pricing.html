<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Pricing - DriveEasy Rentals</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-car-side" style="color: var(--accent-teal); font-size: 1.75rem;"></i>
            <h1>DriveEasy</h1>
        </div>
        <ul class="sidebar-menu">
            <li class="sidebar-menu-item">
                <a th:href="@{/}"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            </li>
            <li class="sidebar-menu-item active">
                <a th:href="@{/admin/cars}"><i class="fa-solid fa-car"></i> Cars Directory</a>
            </li>
            <li class="sidebar-menu-item">
                <a th:href="@{/staff/customers}"><i class="fa-solid fa-users"></i> Customers</a>
            </li>
            <li class="sidebar-menu-item">
                <a th:href="@{/staff/reservations}"><i class="fa-solid fa-calendar-check"></i> Reservations</a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <p>&copy; 2026 DriveEasy Rentals</p>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-wrapper">
        <div class="header-container" style="margin-bottom: 2rem;">
            <div class="header-title">
                <h2>Update Pricing Configuration</h2>
                <p th:text="'Adjust rental rates for ' + ${car.model} + ' (ID: #' + ${car.id} + ')'">Adjust rental rates for Car Model (ID: #0)</p>
            </div>
            <div class="header-actions">
                <a th:href="@{/admin/cars}" class="btn btn-secondary">
                    <i class="fa-solid fa-arrow-left"></i> Back to Fleet
                </a>
            </div>
        </div>

        <!-- Form Card -->
        <div class="form-card">
            <form th:action="@{/admin/cars/{id}/pricing(id=${car.id})}" method="POST">
                
                <div class="form-group">
                    <label>Vehicle</label>
                    <input type="text" class="form-control" th:value="${car.model + ' (' + car.category.displayName + ')'}" disabled style="background-color: var(--bg-tertiary); opacity: 0.8; font-weight: 600;">
                </div>

                <!-- Base Fare -->
                <div class="form-group">
                    <label for="baseFare">Base Fare (₹)</label>
                    <input type="number" step="0.01" min="0" id="baseFare" name="baseFare" class="form-control" th:value="${car.baseFare}" required>
                </div>

                <!-- Rates Row -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="perKmRate">Per Km Rate (₹/km)</label>
                        <input type="number" step="0.01" min="0" id="perKmRate" name="perKmRate" class="form-control" th:value="${car.perKmRate}" required>
                    </div>
                    <div class="form-group">
                        <label for="perHourRate">Per Hour Rate (₹/hr)</label>
                        <input type="number" step="0.01" min="0" id="perHourRate" name="perHourRate" class="form-control" th:value="${car.perHourRate}" required>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/admin/cars}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Save Pricing
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
