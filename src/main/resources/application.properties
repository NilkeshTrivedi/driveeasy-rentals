spring.application.name=DriveEasy-Rentals

# MySQL datasource configuration (adjust credentials as needed)
# Ensure you create the 'driveeasy' database schema in MySQL before running.
spring.datasource.url=jdbc:mysql://localhost:3306/driveeasy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password

# Hibernate DDL auto configuration
# 'update' automatically builds tables (car, customer, reservation) if they do not exist
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

jwt.secret=driveeasy-super-secret-key-phase3-minimum-256-bits-long-replace-in-prod
jwt.expiration-ms=86400000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Don't scan the Thymeleaf MVC controllers for API docs
springdoc.packages-to-scan=com.driveeasy.api

spring.sql.init.mode=always